<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perfil · Planejamento Financeiro</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>

    <main class="conteudo">
      <div class="topo-pagina">
        <div>
          <h1>Perfil</h1>
          <p>Gerencie as informações da sua conta.</p>
        </div>
      </div>

      <div id="areaAlerta"></div>

      <div class="painel" style="max-width:480px;">
        <h2>Meus dados</h2>
        <form id="formPerfil">
          <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" required />
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" disabled />
          </div>
          <div class="campo-linha">
            <div class="campo">
              <label for="salario">Salário / renda mensal</label>
              <input type="number" id="salario" min="0" step="0.01" />
            </div>
            <div class="campo">
              <label for="moeda">Moeda</label>
              <select id="moeda">
                <option value="BRL">R$ (BRL)</option>
                <option value="USD">$ (USD)</option>
                <option value="EUR">€ (EUR)</option>
              </select>
            </div>
          </div>
          <div class="campo">
            <label for="novaSenha">Nova senha (opcional)</label>
            <input type="password" id="novaSenha" minlength="6" placeholder="Deixe em branco para manter a atual" />
          </div>
          <button type="submit" class="btn btn-primario">Salvar alterações</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
