<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Criar conta · Planejamento Financeiro</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo-mini"><span class="icone">$</span> Planejamento Financeiro</div>
      <h1>Crie sua conta</h1>
      <p class="subtitulo">Leva menos de um minuto para começar a organizar suas finanças.</p>

      <div id="areaAlerta"></div>

      <form id="formCadastro">
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" required placeholder="Seu nome" />
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seuemail@exemplo.com" />
        </div>
        <div class="campo-linha">
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required minlength="6" placeholder="Mín. 6 caracteres" />
          </div>
          <div class="campo">
            <label for="moeda">Moeda</label>
            <select id="moeda">
              <option value="BRL" selected>R$ (BRL)</option>
              <option value="USD">$ (USD)</option>
              <option value="EUR">€ (EUR)</option>
            </select>
          </div>
        </div>
        <div class="campo">
          <label for="salario">Salário / renda mensal (opcional)</label>
          <input type="number" id="salario" min="0" step="0.01" placeholder="0,00" />
        </div>
        <button type="submit" class="btn btn-primario btn-bloco">Criar conta</button>
      </form>

      <p class="auth-rodape">Já tem uma conta? <a href="index.html">Entrar</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
