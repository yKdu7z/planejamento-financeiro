<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar · Planejamento Financeiro</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo-mini"><span class="icone">$</span> Planejamento Financeiro</div>
      <h1>Bem-vindo de volta</h1>
      <p class="subtitulo">Entre com sua conta para continuar organizando suas finanças.</p>

      <div id="areaAlerta"></div>

      <form id="formLogin">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seuemail@exemplo.com" />
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
      </form>

      <p class="auth-rodape">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
