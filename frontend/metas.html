<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metas · Planejamento Financeiro</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>

    <main class="conteudo">
      <div class="topo-pagina">
        <div>
          <h1>Metas financeiras</h1>
          <p>Defina objetivos e acompanhe o progresso até alcançá-los.</p>
        </div>
        <button class="btn btn-primario" id="btnNovaMeta">+ Nova meta</button>
      </div>

      <div id="areaAlerta"></div>

      <div id="listaMetas"></div>
      <p class="vazio" id="semMetas" style="display:none;">Você ainda não cadastrou nenhuma meta.</p>
    </main>
  </div>

  <!-- Modal nova meta -->
  <div class="modal-fundo" id="modalFundo">
    <div class="modal">
      <h2>Nova meta</h2>
      <div id="modalAlerta"></div>
      <form id="formMeta">
        <div class="campo">
          <label for="nome">Nome da meta</label>
          <input type="text" id="nome" required placeholder="Ex.: Viagem para o Japão" />
        </div>
        <div class="campo-linha">
          <div class="campo">
            <label for="valor_objetivo">Valor objetivo</label>
            <input type="number" id="valor_objetivo" min="0.01" step="0.01" required />
          </div>
          <div class="campo">
            <label for="valor_inicial">Valor inicial</label>
            <input type="number" id="valor_inicial" min="0" step="0.01" value="0" />
          </div>
        </div>
        <div class="campo-linha">
          <div class="campo">
            <label for="data_inicio">Data de início</label>
            <input type="date" id="data_inicio" required />
          </div>
          <div class="campo">
            <label for="data_limite">Prazo (data limite)</label>
            <input type="date" id="data_limite" required />
          </div>
        </div>
        <div class="modal-acoes">
          <button type="button" class="btn btn-secundario" id="btnCancelar">Cancelar</button>
          <button type="submit" class="btn btn-primario">Salvar meta</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal aporte -->
  <div class="modal-fundo" id="modalAporteFundo">
    <div class="modal">
      <h2>Registrar aporte</h2>
      <div id="modalAporteAlerta"></div>
      <form id="formAporte">
        <input type="hidden" id="aporteMetaId" />
        <div class="campo-linha">
          <div class="campo">
            <label for="aporteValor">Valor do aporte</label>
            <input type="number" id="aporteValor" min="0.01" step="0.01" required />
          </div>
          <div class="campo">
            <label for="aporteData">Data</label>
            <input type="date" id="aporteData" required />
          </div>
        </div>
        <div class="modal-acoes">
          <button type="button" class="btn btn-secundario" id="btnCancelarAporte">Cancelar</button>
          <button type="submit" class="btn btn-primario">Registrar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/metas.js"></script>
</body>
</html>
